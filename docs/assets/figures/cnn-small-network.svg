<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 665" role="img" aria-labelledby="title desc">
  <title id="title">SmallCNN 的局部几何与全局读出</title>
  <desc id="desc">输入三通道十二乘十二图像，经过两层三乘三卷积和 ReLU，通道分别为八和十二。两层均步幅一，局部感受野依次为三和五。GAP 将十二乘十二位置平均为十二维特征，线性层产生两类 logits。参数共一千一百二十六，每图卷积与线性乘加十五万五千五百四十四。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b65"/></marker>
    <pattern id="grid" x="57" y="369" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M19 0H0V19" fill="none" stroke="#a7bcb6" stroke-width="1"/></pattern>
    <style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#263c45;font-size:18px}.title{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:16px;fill:#5c7377}.node{fill:#f2f8f6;stroke:#246b65;stroke-width:1.5}.arrow{fill:none;stroke:#246b65;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="665" rx="14" fill="#fff"/>
  <text x="35" y="43" class="title">同一个 SmallCNN：局部提取之后，才做全局汇聚</text>
  <text x="35" y="75" class="small">两层都保持 12×12 网格；P 包含偏置，MAC 只计卷积与 Linear 的前向乘加</text>
  <rect x="35" y="110" width="150" height="140" rx="8" class="node"/>
  <text x="52" y="141" class="label">RGB 输入</text><text x="52" y="173">[B,3,12,12]</text><text x="52" y="205">r = 1 · j = 1</text><text x="52" y="234" class="small">固定合成条纹</text>
  <rect x="232" y="110" width="190" height="140" rx="8" class="node"/>
  <text x="249" y="141" class="label">Conv 3→8 + ReLU</text><text x="249" y="173">[B,8,12,12]</text><text x="249" y="205">r = 3 · j = 1</text><text x="249" y="234" class="small">P 224 · MAC 31,104</text>
  <rect x="468" y="110" width="205" height="140" rx="8" class="node"/>
  <text x="485" y="141" class="label">Conv 8→12 + ReLU</text><text x="485" y="173">[B,12,12,12]</text><text x="485" y="205">r = 5 · j = 1</text><text x="485" y="234" class="small">P 876 · MAC 124,416</text>
  <rect x="720" y="110" width="145" height="140" rx="8" class="node"/>
  <text x="738" y="141" class="label">GAP</text><text x="738" y="173">[B,12]</text><text x="738" y="205">每通道平均</text><text x="738" y="234" class="small">144 个位置</text>
  <rect x="912" y="110" width="171" height="140" rx="8" class="node"/>
  <text x="929" y="141" class="label">Linear 12→2</text><text x="929" y="173">logits [B,2]</text><text x="929" y="205">交叉熵监督</text><text x="929" y="234" class="small">P 26 · MAC 24</text>
  <path d="M185 178H229M422 178H465M673 178H717M865 178H909" class="arrow"/>
  <text x="232" y="282" class="small">两个卷积：kernel = 3，stride = 1，padding = 1，dilation = 1</text>
  <path d="M35 305H1083" stroke="#dce6e3"/>
  <text x="35" y="343" class="label">选择第二层一个内部位置，追踪它能看到哪里</text>
  <rect x="57" y="369" width="228" height="228" fill="#f7faf9"/>
  <rect x="133" y="445" width="95" height="95" fill="#d2e8de"/>
  <rect x="152" y="464" width="57" height="57" fill="#8cbfae"/>
  <rect x="171" y="483" width="19" height="19" fill="#246b65"/>
  <rect x="57" y="369" width="228" height="228" fill="url(#grid)" stroke="#a7bcb6"/>
  <text x="57" y="623" class="small">12×12 输入；中心索引 (6,6)</text>
  <rect x="335" y="378" width="18" height="18" fill="#246b65"/><text x="365" y="394">指定的空间中心</text>
  <rect x="335" y="415" width="18" height="18" fill="#8cbfae"/><text x="365" y="431">单层 3×3 的覆盖跨度</text>
  <rect x="335" y="452" width="18" height="18" fill="#d2e8de"/><text x="365" y="468">两层合成 5×5：r₂ = 3 + 2×1 = 5</text>
  <text x="335" y="512">局部输出的窗外输入导数为 0。</text>
  <text x="335" y="543">窗内贡献取决于权重、ReLU 开关及路径相消。</text>
  <rect x="335" y="565" width="748" height="66" rx="8" fill="#fff8ef"/>
  <text x="352" y="592">分类 loss 经 GAP 返回全部位置：每个通道的上游梯度分成 144 份。</text>
  <text x="352" y="617" class="small">最终分类器使用整幅图像；“局部感受野 5×5”不等于整网只看见 5×5。</text>
</svg>
