<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 725" role="img" aria-labelledby="title desc">
  <title id="title">一个共同训练案例的数据与状态时间线</title>
  <desc id="desc">变长 episode 经 collate 得到输入、目标和有效位。同一个四维到二维线性模型计算有效误差和。不等长度微批次以整个窗口有效元素数为共同分母反向，全部累积后再裁剪、优化器更新、调度器更新。epoch 结束保存模型缓冲区、优化器、调度器和数据生成器状态，并在恢复后对比下一轮顺序和状态。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b65"/></marker>
    <style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#263c45;font-size:18px}.title{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:16px;fill:#5d7075}.node{fill:#f2f8f6;stroke:#246b65;stroke-width:1.5}.arrow{fill:none;stroke:#246b65;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="725" fill="#fff" rx="14"/>
  <text x="35" y="43" class="title">同一模型与有效监督：数据、更新、恢复必须对应同一目标</text>
  <text x="35" y="74" class="small">共享项目保留 Linear(4,2) 的 10 个参数；更换的是工程环节，不是每节重新生成一个任务</text>
  <rect x="35" y="112" width="200" height="112" rx="8" class="node"/>
  <text x="52" y="143" class="label">ToyEpisodes</text><text x="52" y="174">长度 1…5，连续标签</text><text x="52" y="204" class="small">先按 episode 划分数据</text>
  <rect x="285" y="112" width="215" height="112" rx="8" class="node"/>
  <text x="302" y="143" class="label">collate_episodes</text><text x="302" y="174">x [B,T,4]，y [B,T,2]</text><text x="302" y="204" class="small">valid [B,T]；Padding = NaN</text>
  <rect x="550" y="112" width="220" height="112" rx="8" class="node"/>
  <text x="567" y="143" class="label">TokenRegressor</text><text x="567" y="174">清除无效输入 → Linear</text><text x="567" y="204" class="small">训练统计注册为 Buffer</text>
  <rect x="820" y="112" width="245" height="112" rx="8" class="node"/>
  <text x="837" y="143" class="label">masked_error_sum</text><text x="837" y="174">先选有效标签，再求误差</text><text x="837" y="204" class="small">返回误差和 S、有效标量数 N</text>
  <path d="M235 167H282M500 167H547M770 167H817" class="arrow"/>
  <path d="M35 255H1065" stroke="#dce6e3"/>
  <text x="35" y="291" class="label">一个累积窗口：所有梯度来自同一参数点</text>
  <rect x="35" y="318" width="230" height="122" rx="8" fill="#fff8ef" stroke="#b47949"/>
  <text x="52" y="349">微批 1：N₁ = 10</text><text x="52" y="380">微批 2：N₂ = 30</text><text x="52" y="415" class="small">共同分母 N = 40</text>
  <rect x="319" y="318" width="245" height="122" rx="8" class="node"/>
  <text x="336" y="349" class="label">梯度累加</text><text x="336" y="380">∇S₁ / 40 + ∇S₂ / 40</text><text x="336" y="415" class="small">窗口开始清零，结束才更新</text>
  <rect x="618" y="318" width="195" height="122" rx="8" class="node"/>
  <text x="635" y="349" class="label">一次完整更新</text><text x="635" y="380">检查 → 裁剪 → step</text><text x="635" y="415" class="small">学习率按更新推进</text>
  <rect x="867" y="318" width="198" height="122" rx="8" class="node"/>
  <text x="884" y="349" class="label">重新评估</text><text x="884" y="380">ΣS / ΣN</text><text x="884" y="415" class="small">独立数据，固定模型状态</text>
  <path d="M265 377H316M564 377H615M813 377H864" class="arrow"/>
  <text x="35" y="478" class="small">精度对照：同一输入与初值；CPU autocast 输出 BF16，参数/梯度和损失归约保持 FP32。</text>
  <path d="M35 507H1065" stroke="#dce6e3"/>
  <text x="35" y="544" class="label">仅在 epoch 结束保存；恢复后核验下一整轮</text>
  <rect x="35" y="568" width="440" height="112" rx="8" class="node"/>
  <text x="52" y="600">模型参数与统计 · optimizer · scheduler</text><text x="52" y="631">CPU RNG · DataLoader generator · update_step</text><text x="52" y="662" class="small">数据版本固定；num_workers = 0；无预取游标歧义</text>
  <rect x="553" y="568" width="512" height="112" rx="8" class="node"/>
  <text x="570" y="600">先重建并加载状态，最后恢复随机生成器</text><text x="570" y="631">核对样本顺序、损失、参数、动量和调度器</text><text x="570" y="662" class="small">本例不声称跨版本、多 Worker 或分布式训练逐比特恢复</text>
  <path d="M475 624H550" class="arrow"/>
</svg>
