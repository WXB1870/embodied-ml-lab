<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="810" viewBox="0 0 1020 810" role="img" aria-labelledby="title desc">
<title id="title">从 QKV 投影到合头：完整前向的张量形状</title><desc id="desc">显示 B=2,T=4,D=8,H=2 时，packed QKV 的拆分、头轴交换、Q/K RoPE、沿 Key 的 Mask 和 Softmax、Value 加权、合头与输出投影。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536777"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b74343"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e2e3b;font-size:18px}.heading{font-size:25px;font-weight:700}.sub{font-size:17px;fill:#536777}.small{font-size:15px;fill:#536777}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:17px}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="35" y="42" text-anchor="start" class="heading">Attention 数据流：先标注轴，再核对尺寸</text><text x="35" y="72" text-anchor="start" class="sub">完整前向 T=4；缓存时 Query 长度 L 与 Key 长度 S 可以不同。</text><rect x="320" y="100" width="380" height="58" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="510.0" y="125.0" text-anchor="middle">n₁ = LayerNorm(x)</text><text x="510.0" y="147.0" text-anchor="middle" class="small">[B,T,D] = [2,4,8]</text><path d="M510,158 L510,183" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="183" width="380" height="58" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="510.0" y="208.0" text-anchor="middle">Linear(8,24) → chunk Q / K / V</text><text x="510.0" y="230.0" text-anchor="middle" class="small">packed [2,4,24]</text><rect x="70" y="285" width="260" height="62" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="200.0" y="312.0" text-anchor="middle">Q：分通道，再交换轴</text><text x="200.0" y="334.0" text-anchor="middle" class="small">[2,4,2,4] → [2,2,4,4]</text><path d="M510,241 L510,260 L200,260 L200,285" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="285" width="260" height="62" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="510.0" y="312.0" text-anchor="middle">K：分通道，再交换轴</text><text x="510.0" y="334.0" text-anchor="middle" class="small">[2,4,2,4] → [2,2,4,4]</text><path d="M510,241 L510,260 L510,260 L510,285" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="690" y="285" width="260" height="62" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="820.0" y="312.0" text-anchor="middle">V：分通道，再交换轴</text><text x="820.0" y="334.0" text-anchor="middle" class="small">[2,4,2,4] → [2,2,4,4]</text><path d="M510,241 L510,260 L820,260 L820,285" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="382" width="260" height="55" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="200.0" y="415.5" text-anchor="middle">RoPE(Q) · 位置 0..3</text><path d="M200,347 L200,382" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="382" width="260" height="55" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="510.0" y="415.5" text-anchor="middle">RoPE(K) · 位置 0..3</text><path d="M510,347 L510,382" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="205" y="478" width="400" height="75" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="405.0" y="511.5" text-anchor="middle">QKᵀ / √4 → Mask → softmax(-1)</text><text x="405.0" y="533.5" text-anchor="middle" class="small">scores / A [B,H,Query,Key] = [2,2,4,4]</text><path d="M200,437 L200,458 L310,458 L310,478" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M510,437 L510,478" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="500" text-anchor="start" class="small">allowed [2,1,4,4]</text><text x="640" y="524" text-anchor="start" class="small">沿头轴广播；True 可见</text><path d="M405,553 L405,588" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="205" y="588" width="400" height="62" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="405.0" y="615.0" text-anchor="middle">Z = A @ V</text><text x="405.0" y="637.0" text-anchor="middle" class="small">[B,H,Query,dᵥ] = [2,2,4,4]</text><path d="M820,347 L820,620 L605,620" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="832" y="400" text-anchor="start" class="small">V 不旋转</text><path d="M405,650 L405,680" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="205" y="680" width="650" height="62" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="530.0" y="707.0" text-anchor="middle">transpose → reshape → Linear(8,8)</text><text x="530.0" y="729.0" text-anchor="middle" class="small">[2,4,2,4] → [2,4,8] → 第一条残差</text><text x="35" y="786" text-anchor="start" class="sub">A 与 Z 的尺寸在这里恰好相同，但末轴分别是 Key 位置与 Value 通道。</text></svg>
