<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 60 704 460" width="704" height="460"><title>FiLM: conditioning branch generates modulation parameters for a target network</title><style>svg {font-family:Arial,Helvetica,sans-serif;}


.figure-element, .figure-line, .figure-path {
  stroke: #666;
  stroke-miterlimit: 10px;
  stroke-width: 1.5px;
}


.figure-line {
  fill: none;
}


.figure-path {
  fill: #666;
  stroke-width: 1px;
}


.figure-group {
  fill: #f9f9f9;
  stroke: #666;
  stroke-width: 1.5px;
  stroke-opacity: 0.6;
  stroke-miterlimit: 10px;
}


.figure-faded {
  opacity: 0.6;
}


.figure-box {
  rx: 6px;
  ry: 6px;
}


.figure-text {
  fill: #000;
  opacity: 0.6;
  font-size: 13px;
}


.figure-text-faded {
  opacity: 0.6;
}


.figure-film-generator {
  /* stroke: #006064; */
  /* fill: #80DEEA; */
  
  stroke: hsl(203, 65%, 70%);
  fill: hsl(203, 65%, 85%);
}


.figure-film-generator-shaded {
  /* stroke: #006064; */
  /* fill: #00838F; */
  
  stroke: hsl(203, 15%, 85%);
  fill: hsl(203, 15%, 95%);
}


.figure-filmed-network {
  /* stroke: #BF360C; */
  /* fill: #FFAB91; */
  
  stroke: hsl(11, 65%, 70%);
  fill: rgb(242, 203, 194);
