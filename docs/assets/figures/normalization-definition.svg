 class="small" text-anchor="middle">•</text><rect x="900" y="348" width="47" height="32" rx="4" fill="#edf1f4" stroke="#cdd7dc"/><text x="923" y="371" class="small" text-anchor="middle">•</text><text x="717" y="414" class="small" text-anchor="end">b1 · t2</text><rect x="735" y="390" width="47" height="32" rx="4" fill="#edf1f4" stroke="#cdd7dc"/><text x="758" y="413" class="small" text-anchor="middle">•</text><rect x="790" y="390" width="47" height="32" rx="4" fill="#99cbb9" stroke="#246b65"/><text x="813" y="413" class="small" text-anchor="middle">•</text><rect x="845" y="390" width="47" height="32" rx="4" fill="#edf1f4" stroke="#cdd7dc"/><text x="868" y="413" class="small" text-anchor="middle">•</text><rect x="900" y="390" width="47" height="32" rx="4" fill="#edf1f4" stroke="#cdd7dc"/><text x="923" y="413" class="small" text-anchor="middle">•</text><path d="M631 300H948" stroke="#aabdc2" stroke-dasharray="4 4"/><text x="42" y="471" class="label" text-anchor="start">同一个 (b,t) 的 4 个通道</text><text x="607" y="471" class="label" text-anchor="start">同一通道的 B×T=6 个位置</text><text x="42" y="508" class="guide" text-anchor="start">输入布局：[B,T,D]</text><text x="607" y="508" class="guide" text-anchor="start">调用 BN 前转轴：[B,D,T]</text><text x="42" y="542" class="small" text-anchor="start">每个位置独立；不跨样本统计。</text><text x="607" y="542" class="small" text-anchor="start">评估态通常改用已保存的运行统计。</text><text x="35" y="576" class="small" text-anchor="start">借鉴 Group Normalization Fig. 2 的统计集合视角，按本章序列轴独立绘制。</text></svg>
