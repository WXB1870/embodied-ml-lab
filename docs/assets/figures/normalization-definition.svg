<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
<title id="title">归一化：哪些元素一起计算统计量？</title><desc id="desc">对 B=2、T=3、D=4 的序列特征，LayerNorm(D) 在单个位置的四个通道中统计；训练态 BatchNorm1d(D) 对每个通道在六个样本时间位置中统计。</desc>
<defs><marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b65"/></marker><marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42679a"/></marker><marker id="a-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b47a2e"/></marker><marker id="a-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:19px;fill:#263c45}.title{font-size:27px;font-weight:700}.heading{font-size:22px;font-weight:700}.small{font-size:16px;fill:#5c7377}.label{font-size:20px;font-weight:700}.formula{font-size:23px}.guide{font-size:18px;fill:#4b626b}</style></defs>
<rect width="1120" height="590" rx="12" fill="#fff"/><text x="35" y="45" class="title" text-anchor="start">归一化：哪些元素一起计算统计量？</text>
