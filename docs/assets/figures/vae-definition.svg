<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
<title id="title">VAE：训练时推断潜变量，生成时从先验出发</title><desc id="desc">上排由观测数据经过近似后验与重参数化形成潜变量，再由解码器定义重建分布；下排直接从先验采样，经同一个解码器生成新数据。</desc>
<defs><marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b65"/></marker><marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42679a"/></marker><marker id="a-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b47a2e"/></marker><marker id="a-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:19px;fill:#263c45}.title{font-size:27px;font-weight:700}.heading{font-size:22px;font-weight:700}.small{font-size:16px;fill:#5c7377}.label{font-size:20px;font-weight:700}.formula{font-size:23px}.guide{font-size:18px;fill:#4b626b}</style></defs>
<rect width="1120" height="600" rx="12" fill="#fff"/><text x="35" y="45" class="title" text-anchor="start">VAE：训练时推断潜变量，生成时从先验出发</text>
<text x="35" y="85" class="guide" text-anchor="start">先看两条流程的输入不同，再阅读 ELBO 的推导。</text><text x="35" y="134" class="heading" text-anchor="start">训练：观测 a 已知</text><rect x="35" y="185" width="135" height="85" rx="8" fill="#eef3fb" stroke="#42679a" stroke-width="1.6"/><text x="51" y="234.5" class="label" text-anchor="start">数据 a</text><rect x="215" y="185" width="180" height="85" rx="8" fill="#edf7f4" stroke="#246b65" stroke-width="1.6"/><text x="231" y="218" class="label" text-anchor="start">Encoder φ</text><text x="231" y="247" class="small" text-anchor="start">qφ(z|a)</text><rect x="440" y="185" width="170" height="85" rx="8" fill="#edf7f4" stroke="#246b65" stroke-width="1.6"/><text x="456" y="218" class="label" text-anchor="start">均值与尺度</text><text x="456" y="247" class="small" text-anchor="start">μ(a), σ(a)</text><rect x="655" y="185" width="195" height="85" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="671" y="218" class="label" text-anchor="start">重参数化</text><text x="671" y="247" class="small" text-anchor="start">z = μ + σ ⊙ ε</text><rect x="900" y="185" width="185" height="85" rx="8" fill="#eef3fb" stroke="#42679a" stroke-width="1.6"/><text x="916" y="218" class="label" text-anchor="start">Decoder θ</text><text x="916" y="247" class="small" text-anchor="start">给出 pθ(a|z)</text><path d="M170 228H215" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><path d="M395 228H440" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><path d="M610 228H655" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><path d="M850 228H900" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><rect x="655" y="99" width="195" height="55" rx="8" fill="#f4f6f8" stroke="#718096" stroke-width="1.6"/><text x="671" y="133.5" class="label" text-anchor="start">ε ~ N(0,I)</text><path d="M752 154V185" fill="none" stroke="#718096" stroke-width="2.6" marker-end="url(#a-gray)"/><path d="M525 270V309" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><rect x="410" y="309" width="270" height="66" rx="8" fill="#f4f6f8" stroke="#718096" stroke-width="1.6"/><text x="426" y="349.0" class="label" text-anchor="start">KL 项：与先验比较</text><path d="M992 270V309" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><rect x="840" y="309" width="245" height="66" rx="8" fill="#f4f6f8" stroke="#718096" stroke-width="1.6"/><text x="856" y="349.0" class="label" text-anchor="start">重建项：评价观测 a</text><path d="M35 404H1085" stroke="#dce6e3"/><text x="35" y="440" class="heading" text-anchor="start">生成：不需要观测 a，也不需要 Encoder</text><rect x="210" y="473" width="195" height="77" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="226" y="506" class="label" text-anchor="start">z ~ p(z)</text><text x="226" y="535" class="small" text-anchor="start">从先验采样</text><rect x="500" y="473" width="225" height="77" rx="8" fill="#eef3fb" stroke="#42679a" stroke-width="1.6"/><text x="516" y="506" class="label" text-anchor="start">同一个 Decoder θ</text><text x="516" y="535" class="small" text-anchor="start">使用已训练的参数</text><rect x="815" y="473" width="270" height="77" rx="8" fill="#eef3fb" stroke="#42679a" stroke-width="1.6"/><text x="831" y="506" class="label" text-anchor="start">产生新数据</text><text x="831" y="535" class="small" text-anchor="start">a ~ pθ(·|z)</text><path d="M405 512H500" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><path d="M725 512H815" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><text x="35" y="583" class="small" text-anchor="start">对照 Kingma &amp; Welling §2、Fig. 1 与重参数化公式独立绘制；上排示意对角高斯近似后验。</text></svg>
