<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">残差连接：直接传递 + 学习修正</title><desc id="desc">左图为本文 y=x+F(x) 的加法核心，右图对照原始 ResNet 的两层变换、恒等旁路和加法后 ReLU。</desc>
<defs><marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b65"/></marker><marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42679a"/></marker><marker id="a-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b47a2e"/></marker><marker id="a-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:19px;fill:#263c45}.title{font-size:27px;font-weight:700}.heading{font-size:22px;font-weight:700}.small{font-size:16px;fill:#5c7377}.label{font-size:20px;font-weight:700}.formula{font-size:23px}.guide{font-size:18px;fill:#4b626b}</style></defs>
<rect width="1120" height="540" rx="12" fill="#fff"/><text x="35" y="45" class="title" text-anchor="start">残差连接：直接传递 + 学习修正</text>
<text x="35" y="82" class="guide" text-anchor="start">先识别两条路径，再分析它们的导数。</text><text x="35" y="120" class="heading" text-anchor="start">本文的加法核心</text><path d="M580 105V476" stroke="#dce6e3"/><rect x="35" y="220" width="120" height="78" rx="8" fill="#eef3fb" stroke="#42679a" stroke-width="1.6"/><text x="51" y="253" class="label" text-anchor="start">输入 x</text><text x="51" y="282" class="small" text-anchor="start">(1,2)</text><circle cx="175" cy="259" r="4" fill="#246b65"/><path d="M155 259H175V165H215" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><rect x="215" y="118" width="200" height="94" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="231" y="151" class="label" text-anchor="start">变换分支 F</text><text x="231" y="180" class="small" text-anchor="start">更新 (−0.1,0.3)</text><path d="M415 165H450V240" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><path d="M175 259V356H450V278" fill="none" stroke="#42679a" stroke-width="2.6" marker-end="url(#a-blue)"/><text x="250" y="386" class="small" text-anchor="start">直接路径：传递原来的 x</text><circle cx="450" cy="259" r="19" fill="#fff" stroke="#246b65" stroke-width="2"/><text x="450" y="266" class="formula" text-anchor="middle">+</text><path d="M469 259H495" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><text x="500" y="245" class="label" text-anchor="start">输出 y</text><text x="495" y="277" class="small" text-anchor="start">(0.9,2.3)</text><text x="35" y="442" class="guide" text-anchor="start">当 F(x)=0 时，加法核心原样保留输入。</text><text x="630" y="120" class="heading" text-anchor="start">经典 ResNet basic block</text><text x="735" y="151" class="label" text-anchor="middle">x</text><path d="M735 158V180" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><rect x="655" y="180" width="160" height="46" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="671" y="210.0" class="label" text-anchor="start">权重层 1</text><path d="M735 226V245" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><text x="735" y="267" class="label" text-anchor="middle">ReLU</text><path d="M735 275V294" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><rect x="655" y="294" width="160" height="46" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="671" y="324.0" class="label" text-anchor="start">权重层 2</text><path d="M735 340V365" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><circle cx="735" cy="158" r="3" fill="#246b65"/><path d="M735 158H960V384H754" fill="none" stroke="#42679a" stroke-width="2.6" marker-end="url(#a-blue)"/><text x="980" y="281" class="small" text-anchor="start">恒等旁路</text><circle cx="735" cy="384" r="19" fill="#fff" stroke="#246b65" stroke-width="2"/><text x="735" y="391" class="formula" text-anchor="middle">+</text><path d="M735 403V420" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><rect x="655" y="420" width="160" height="43" rx="8" fill="#f4f6f8" stroke="#718096" stroke-width="1.6"/><text x="671" y="448.5" class="label" text-anchor="start">ReLU</text><path d="M815 442H900" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><text x="908" y="449" class="small" text-anchor="start">最终输出</text><text x="35" y="512" class="small" text-anchor="start">依据 He et al., 2016, Fig. 2 独立绘制；右图的加法后 ReLU 不包含在左图的 y=x+F(x) 中。</text></svg>
