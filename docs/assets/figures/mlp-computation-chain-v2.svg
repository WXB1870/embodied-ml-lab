<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc" width="1100" height="510">
  <title id="title">同一个 17 参数 MLP：前向、反向与更新</title>
  <desc id="desc">输入 X 为三行二维向量，经三维隐藏层及 ReLU，再投影为两维预测。两组权重和偏置共十七个参数。目标与预测形成半均方误差，反向计算五组梯度，其中只有四组参数由 SGD 更新，输入梯度仅用于核对。</desc>
  <defs>
    <marker id="forward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b65"/></marker>
    <marker id="backward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a45b3d"/></marker>
    <style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#263c45;font-size:18px}.title{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:700}.mono{font-family:monospace;font-size:17px}.muted{fill:#5d7075;font-size:17px}.node{fill:#f2f8f6;stroke:#246b65;stroke-width:1.5}.parameter{fill:#fff8ef;stroke:#b47949;stroke-width:1.4}.fwd{fill:none;stroke:#246b65;stroke-width:2;marker-end:url(#forward)}.bwd{fill:none;stroke:#a45b3d;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#backward)}</style>
  </defs>
  <rect width="1100" height="650" fill="#fff" rx="14"/>
  <text x="35" y="43" class="title">一次完整计算：2 → 3 → 2，Batch = 3</text>
  <text x="35" y="74" class="muted">沿前向得到损失，再沿反向计算输入与参数梯度。</text>
  <rect x="240" y="105" width="190" height="75" rx="8" class="parameter"/>
  <text x="258" y="134" class="label">W₁ [3,2] · b₁ [3]</text><text x="258" y="162">9 个参数</text>
  <rect x="677" y="105" width="190" height="75" rx="8" class="parameter"/>
  <text x="695" y="134" class="label">W₂ [2,3] · b₂ [2]</text><text x="695" y="162">8 个参数</text>
  <path d="M335 180V217" class="fwd"/><path d="M772 180V217" class="fwd"/>
  <rect x="35" y="220" width="150" height="110" rx="8" class="node"/>
  <text x="55" y="250" class="label">输入 X</text><text x="55" y="278" class="mono">[3,2]</text><text x="55" y="309">第 1 行 [1,−2]</text>
  <rect x="240" y="220" width="190" height="110" rx="8" class="node"/>
  <text x="258" y="250" class="label">仿射变换</text><text x="258" y="278" class="mono">Z = XW₁ᵀ + b₁</text><text x="258" y="309">[3,3]</text>
  <rect x="482" y="220" width="145" height="110" rx="8" class="node"/>
  <text x="502" y="250" class="label">ReLU</text><text x="502" y="278" class="mono">A = ReLU(Z)</text><text x="502" y="309">[3,3]</text>
  <rect x="677" y="220" width="190" height="110" rx="8" class="node"/>
  <text x="695" y="250" class="label">仿射变换</text><text x="695" y="278" class="mono">Ŷ = AW₂ᵀ + b₂</text><text x="695" y="309">[3,2]</text>
  <rect x="919" y="220" width="145" height="110" rx="8" class="node"/>
  <text x="937" y="250" class="label">预测 Ŷ</text><text x="937" y="278" class="mono">[3,2]</text><text x="937" y="309">[1.2,−0.3] …</text>
  <path d="M185 270H237M430 270H479M627 270H674M867 270H916" class="fwd"/>
  <path d="M991 330V385" class="fwd"/>
  <rect x="868" y="388" width="196" height="90" rx="8" class="node"/>
  <text x="885" y="419" class="label">半均方误差 L</text><text x="885" y="448" class="mono">Σ(Ŷ−Y)² / 12</text><text x="885" y="470" class="muted">标量 0.092791667</text>
  <rect x="677" y="394" width="145" height="68" rx="8" class="node"/>
  <text x="695" y="421" class="label">目标 Y [3,2]</text><text x="695" y="448">固定监督</text><path d="M822 428H865" class="fwd"/>
  <path d="M966 388V354H796M753 354H576M532 354H350M309 354H108V332" class="bwd"/>
  <text x="895" y="376" class="muted">G = (Ŷ−Y)/6</text>
  <text x="638" y="376" class="muted">∇A L = GW₂</text>
  <text x="408" y="376" class="muted">Δ₁ = (GW₂) ⊙ 1{Z&gt;0}</text>
  <text x="37" y="376" class="muted">∇X L = Δ₁W₁</text>
  <rect x="35" y="402" width="548" height="83" rx="8" fill="#fff8ef"/>
  <text x="53" y="431">参数梯度：∇W₁ L = Δ₁ᵀX，∇W₂ L = GᵀA</text>
  <text x="53" y="462">偏置梯度：沿 Batch 轴求和</text>
  <path d="M35 513H1064" stroke="#dce6e3"/>
  
  
  
</svg>
