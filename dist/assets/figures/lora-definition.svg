<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">LoRA：冻结基座，训练低秩更新</title><desc id="desc">输入同时通过冻结权重与低秩分支，两路结果相加；使用行向量约定以对应本文 PyTorch 实现。</desc>
<defs><marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b65"/></marker><marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42679a"/></marker><marker id="a-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b47a2e"/></marker><marker id="a-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:19px;fill:#263c45}.title{font-size:27px;font-weight:700}.heading{font-size:22px;font-weight:700}.small{font-size:16px;fill:#5c7377}.label{font-size:20px;font-weight:700}.formula{font-size:23px}.guide{font-size:18px;fill:#4b626b}</style></defs>
<rect width="1120" height="520" rx="12" fill="#fff"/><text x="35" y="45" class="title" text-anchor="start">LoRA：冻结基座，训练低秩更新</text>
<text x="35" y="82" class="guide" text-anchor="start">先认识两条分支，再看参数量、初始化和权重合并。</text><rect x="35" y="220" width="140" height="80" rx="8" fill="#eef3fb" stroke="#42679a" stroke-width="1.6"/><text x="51" y="253" class="label" text-anchor="start">输入 X</text><text x="51" y="282" class="small" text-anchor="start">[batch,d_in]</text><circle cx="205" cy="260" r="4" fill="#246b65"/><path d="M175 260H205V165H280" fill="none" stroke="#42679a" stroke-width="2.6" marker-end="url(#a-blue)"/><rect x="280" y="120" width="230" height="90" rx="8" fill="#eef3fb" stroke="#42679a" stroke-width="1.6"/><text x="296" y="153" class="label" text-anchor="start">冻结 W₀</text><text x="296" y="182" class="small" text-anchor="start">[d_out,d_in]</text><path d="M510 165H890V241" fill="none" stroke="#42679a" stroke-width="2.6" marker-end="url(#a-blue)"/><path d="M205 260V363H280" fill="none" stroke="#b47a2e" stroke-width="2.6" marker-end="url(#a-orange)"/><rect x="280" y="320" width="180" height="85" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="296" y="353" class="label" text-anchor="start">可训练 A</text><text x="296" y="382" class="small" text-anchor="start">[r,d_in]</text><path d="M460 363H520" fill="none" stroke="#b47a2e" stroke-width="2.6" marker-end="url(#a-orange)"/><rect x="520" y="320" width="180" height="85" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="536" y="353" class="label" text-anchor="start">可训练 B</text><text x="536" y="382" class="small" text-anchor="start">[d_out,r]</text><path d="M700 363H750" fill="none" stroke="#b47a2e" stroke-width="2.6" marker-end="url(#a-orange)"/><rect x="750" y="320" width="100" height="85" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="766" y="353" class="label" text-anchor="start">缩放</text><text x="766" y="382" class="small" text-anchor="start">α/r</text><path d="M850 363H890V279" fill="none" stroke="#b47a2e" stroke-width="2.6" marker-end="url(#a-orange)"/><circle cx="890" cy="260" r="19" fill="#fff" stroke="#246b65" stroke-width="2"/><text x="890" y="267" class="formula" text-anchor="middle">+</text><path d="M909 260H945" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><rect x="945" y="220" width="145" height="80" rx="8" fill="#edf7f4" stroke="#246b65" stroke-width="1.6"/><text x="961" y="253" class="label" text-anchor="start">输出 Y</text><text x="961" y="282" class="small" text-anchor="start">[batch,d_out]</text><text x="560" y="449" class="formula" text-anchor="middle">Y = X W₀ᵀ + (α/r) X Aᵀ Bᵀ</text><text x="35" y="482" class="small" text-anchor="start">冻结 W₀ 是不更新其参数，不是对输入 X 断图；A、B 的初始梯度行为见正文。</text><text x="35" y="508" class="small" text-anchor="start">依据 Hu et al., LoRA, Fig. 1 与 §4.1 独立绘制。</text></svg>
