<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc" width="1120" height="530">
<title id="title">扩散模型：固定加噪，学习反向生成</title><desc id="desc">从左到右是固定前向加噪，从右到左是学习的反向过程。本文将干净数据记为 a，第一次加噪后才是数组状态 x[0]。</desc>
<defs><marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b65"/></marker><marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42679a"/></marker><marker id="a-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b47a2e"/></marker><marker id="a-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718096"/></marker><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:19px;fill:#263c45}.title{font-size:27px;font-weight:700}.heading{font-size:22px;font-weight:700}.small{font-size:16px;fill:#5c7377}.label{font-size:20px;font-weight:700}.formula{font-size:23px}.guide{font-size:18px;fill:#4b626b}</style></defs>
<rect width="1120" height="555" rx="12" fill="#fff"/><text x="35" y="45" class="title" text-anchor="start">扩散模型：固定加噪，学习反向生成</text>
<text x="35" y="82" class="guide" text-anchor="start">橙色：前向加噪；绿色：反向生成。</text><rect x="35" y="156" width="215" height="85" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="51" y="189" class="label" text-anchor="start">干净数据 a</text><text x="51" y="218" class="small" text-anchor="start">来自训练数据</text><rect x="300" y="156" width="215" height="85" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="316" y="189" class="label" text-anchor="start">第一次加噪 x[0]</text><text x="316" y="218" class="small" text-anchor="start">仍包含较多信号</text><rect x="565" y="156" width="215" height="85" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="581" y="189" class="label" text-anchor="start">中间状态 x[k]</text><text x="581" y="218" class="small" text-anchor="start">信号与噪声混合</text><rect x="830" y="156" width="215" height="85" rx="8" fill="#fff5e8" stroke="#b47a2e" stroke-width="1.6"/><text x="846" y="189" class="label" text-anchor="start">终端 x[K−1]</text><text x="846" y="218" class="small" text-anchor="start">接近选定噪声先验</text><path d="M250 198H300" fill="none" stroke="#b47a2e" stroke-width="2.6" marker-end="url(#a-orange)"/><path d="M515 198H565" fill="none" stroke="#b47a2e" stroke-width="2.6" marker-end="url(#a-orange)"/><path d="M780 198H830" fill="none" stroke="#b47a2e" stroke-width="2.6" marker-end="url(#a-orange)"/><path d="M913 241V290H696V241" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><path d="M648 241V290H431V241" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><path d="M383 241V290H166V241" fill="none" stroke="#246b65" stroke-width="2.6" marker-end="url(#a-teal)"/><text x="557" y="131" class="small" text-anchor="middle">q：预先规定的前向过程 →</text><text x="557" y="321" class="small" text-anchor="middle">← pθ：从当前状态预测反向转移</text><rect x="35" y="361" width="505" height="105" rx="8" fill="#f4f6f8" stroke="#718096" stroke-width="1.6"/><text x="51" y="394" class="label" text-anchor="start">训练时</text><text x="51" y="423" class="small" text-anchor="start">抽 a、等级 k 和噪声 ε，构造 x[k]；再拟合目标 ε。</text><rect x="580" y="361" width="505" height="105" rx="8" fill="#f4f6f8" stroke="#718096" stroke-width="1.6"/><text x="596" y="394" class="label" text-anchor="start">生成时</text><text x="596" y="423" class="small" text-anchor="start">从新噪声出发，反复预测并按采样规则更新。</text><text x="35" y="505" class="guide" text-anchor="start">a：干净数据；x[0]：第一级带噪状态。</text></svg>
