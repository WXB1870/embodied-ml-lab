<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1020" viewBox="0 0 1020 1020" role="img" aria-labelledby="title desc">
<title id="title">原论文 Encoder–Decoder：Post-LN 与三子层 Decoder</title><desc id="desc">按原论文机制重新绘制，Encoder 由双向自注意力与 FFN 构成，Decoder 由 masked self-attention、cross-attention、FFN 构成；每个子层后为残差相加和 LayerNorm。源侧最终表示供目标侧每层 cross-attention 的 K/V，目标状态提供 Q。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536777"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b74343"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e2e3b;font-size:18px}.heading{font-size:25px;font-weight:700}.sub{font-size:17px;fill:#536777}.small{font-size:15px;fill:#536777}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:17px}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="35" y="42" text-anchor="start" class="heading">原论文结构：Encoder–Decoder · Post-LN</text><text x="35" y="72" text-anchor="start" class="sub">本图按 2017 年论文机制重新绘制；不是前面的两层 decoder-only 教学模型。</text><text x="250" y="115" text-anchor="middle" class="sub">源序列（已知）</text><text x="750" y="115" text-anchor="middle" class="sub">目标序列（右移输入）</text><rect x="85" y="140" width="330" height="65" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="250.0" y="168.5" text-anchor="middle">Embedding × √D + Position</text><text x="250.0" y="190.5" text-anchor="middle" class="small">正弦位置编码 · D=512</text><rect x="585" y="140" width="330" height="65" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="750.0" y="168.5" text-anchor="middle">Embedding × √D + Position</text><text x="750.0" y="190.5" text-anchor="middle" class="small">预测位置只使用合法目标前缀</text><rect x="45" y="240" width="410" height="335" rx="9" fill="#fafbfc" stroke="#9cabb5" stroke-dasharray="6 5"/><rect x="545" y="240" width="410" height="545" rx="9" fill="#fafbfc" stroke="#9cabb5" stroke-dasharray="6 5"/><text x="65" y="268" text-anchor="start" class="sub">Encoder layer × 6</text><text x="565" y="268" text-anchor="start" class="sub">Decoder layer × 6</text><rect x="125" y="292" width="250" height="48" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="250.0" y="322.0" text-anchor="middle">Bidirectional Self-Attention</text><path d="M250,340 L250,362" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="125" y="362" width="250" height="43" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="250.0" y="389.5" text-anchor="middle">Add &amp; LayerNorm</text><path d="M250,278 L85,278 L85,383 L125,383" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="125" y="442" width="250" height="48" rx="7" fill="#fff6e9" stroke="#aa6922" stroke-width="1.4"/><text x="250.0" y="472.0" text-anchor="middle">Position-wise FFN</text><path d="M250,490 L250,512" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="125" y="512" width="250" height="43" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="250.0" y="539.5" text-anchor="middle">Add &amp; LayerNorm</text><path d="M250,428 L85,428 L85,533 L125,533" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M250,205 L250,292" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M250,405 L250,442" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M250,555 L250,615" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="85" y="615" width="330" height="65" rx="7" fill="#f6f8fa" stroke="#81909c" stroke-width="1.4"/><text x="250.0" y="643.5" text-anchor="middle">最终 Encoder 表示 C</text><text x="250.0" y="665.5" text-anchor="middle" class="small">每个目标 Decoder 层均可读取</text><rect x="625" y="292" width="250" height="48" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="750.0" y="322.0" text-anchor="middle">Masked Self-Attention</text><path d="M750,340 L750,362" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="362" width="250" height="43" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="750.0" y="389.5" text-anchor="middle">Add &amp; LayerNorm</text><path d="M750,278 L585,278 L585,383 L625,383" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="467" width="250" height="48" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="750.0" y="497.0" text-anchor="middle">Cross-Attention</text><path d="M750,515 L750,537" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="537" width="250" height="43" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="750.0" y="564.5" text-anchor="middle">Add &amp; LayerNorm</text><path d="M750,453 L585,453 L585,558 L625,558" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="642" width="250" height="48" rx="7" fill="#fff6e9" stroke="#aa6922" stroke-width="1.4"/><text x="750.0" y="672.0" text-anchor="middle">Position-wise FFN</text><path d="M750,690 L750,712" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="712" width="250" height="43" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="750.0" y="739.5" text-anchor="middle">Add &amp; LayerNorm</text><path d="M750,628 L585,628 L585,733 L625,733" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M750,205 L750,292" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M750,405 L750,467" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="771" y="447" text-anchor="start" class="small">Q</text><path d="M750,580 L750,642" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M415,647 L495,647 L495,491 L625,491" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="601" text-anchor="end" class="small">K/V 来自 C</text><path d="M750,755 L750,835" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="835" width="330" height="62" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="750.0" y="862.0" text-anchor="middle">Linear → Softmax</text><text x="750.0" y="884.0" text-anchor="middle" class="small">下一目标 Token 的分布</text><text x="40" y="752" text-anchor="start" class="sub">每个子层的结构：</text><text x="40" y="785" text-anchor="start" class="mono">LN(x + Sublayer(x))</text><text x="40" y="822" text-anchor="start" class="small">残差先相加，再进行 LayerNorm。</text><text x="40" y="857" text-anchor="start" class="small">源侧可双向；目标侧 Self-Attention 因果。</text><text x="35" y="945" text-anchor="start" class="sub">图省略 Dropout 与具体 FFN 宽度，保持子层顺序、残差位置与跨序列连接。</text><text x="35" y="980" text-anchor="start" class="small">来源：Vaswani et al., Attention Is All You Need, §3.1–3.5 (arXiv:1706.03762).</text></svg>
