<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">RoPE 二维旋转与相对位置不变性</title><desc id="desc">两个相同单位向量在位置 1 和 3 按 π/6 的频率旋转，角度 30 度与 90 度；整体平移到位置 3 和 5 后角度 90 度与 150 度，夹角仍为 60 度，点积均为 1/2。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536777"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b74343"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e2e3b;font-size:18px}.heading{font-size:25px;font-weight:700}.sub{font-size:17px;fill:#536777}.small{font-size:15px;fill:#536777}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:17px}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="35" y="42" text-anchor="start" class="heading">RoPE：保持范数，改变相对夹角</text><text x="35" y="72" text-anchor="start" class="sub">可手算例：q=k=(1,0)，ω=π/6；这是教学角度，不是主模型的频率设置。</text><circle cx="245" cy="300" r="130" fill="none" stroke="#d8e0e5" stroke-dasharray="5 5"/><path d="M90,300 L400,300" fill="none" stroke="#536777" stroke-width="1" marker-end="url(#arrow)"/><path d="M245,455 L245,145" fill="none" stroke="#536777" stroke-width="1" marker-end="url(#arrow)"/><text x="245" y="121" text-anchor="middle" class="sub">m=1, n=3</text><path d="M245,300 L357.58330249197707,235.0" fill="none" stroke="#365bc5" stroke-width="3" marker-end="url(#arrow)"/><circle cx="357.58330249197707" cy="235.0" r="4" fill="#365bc5"/><text x="373.58330249197707" y="227.0" text-anchor="start" style="fill:#365bc5">q′ · 30°</text><path d="M245,300 L245.0,170.0" fill="none" stroke="#18776c" stroke-width="3" marker-end="url(#arrow)"/><circle cx="245.0" cy="170.0" r="4" fill="#18776c"/><text x="261.0" y="162.0" text-anchor="start" style="fill:#18776c">k′ · 90°</text><path d="M288.30127018922195,275.0 A50,50 0 0 0 245.0,250.0" fill="none" stroke="#aa6922" stroke-width="2"/><text x="265" y="235" text-anchor="start" style="fill:#aa6922">60°</text><text x="245" y="488" text-anchor="middle" class="mono">q′ · k′ = cos 60° = 1/2</text><circle cx="715" cy="300" r="130" fill="none" stroke="#d8e0e5" stroke-dasharray="5 5"/><path d="M560,300 L870,300" fill="none" stroke="#536777" stroke-width="1" marker-end="url(#arrow)"/><path d="M715,455 L715,145" fill="none" stroke="#536777" stroke-width="1" marker-end="url(#arrow)"/><text x="715" y="121" text-anchor="middle" class="sub">共同平移 2：m=3, n=5</text><path d="M715,300 L715.0,170.0" fill="none" stroke="#365bc5" stroke-width="3" marker-end="url(#arrow)"/><circle cx="715.0" cy="170.0" r="4" fill="#365bc5"/><text x="731.0" y="162.0" text-anchor="start" style="fill:#365bc5">q′ · 90°</text><path d="M715,300 L602.4166975080229,235.0" fill="none" stroke="#18776c" stroke-width="3" marker-end="url(#arrow)"/><circle cx="602.4166975080229" cy="235.0" r="4" fill="#18776c"/><text x="586.4166975080229" y="227.0" text-anchor="end" style="fill:#18776c">k′ · 150°</text><path d="M715.0,250.0 A50,50 0 0 0 671.6987298107781,275.0" fill="none" stroke="#aa6922" stroke-width="2"/><text x="700" y="235" text-anchor="end" style="fill:#aa6922">60°</text><text x="715" y="488" text-anchor="middle" class="mono">q′ · k′ = cos 60° = 1/2</text><path d="M430,290 L520,290" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="475" y="264" text-anchor="middle" class="small">位置 +2</text><text x="35" y="546" text-anchor="start" class="mono">(R(mω)q)ᵀ(R(nω)k) = qᵀR((n−m)ω)k</text><text x="35" y="581" text-anchor="start" class="sub">主模型 dₕ=4：配对 (0,1)、(2,3)，频率为 1 和 0.01；V 不旋转。</text><text x="35" y="612" text-anchor="start" class="small">只保证该固定内容对的相对匹配；不保证任意点积随距离单调减小。</text></svg>
