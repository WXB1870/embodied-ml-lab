<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
<title id="title">VLA 的训练和缓存推理数据流</title><desc id="desc">训练区从干净动作和高斯噪声构造 X_t 与目标 Z-A，经全模型前向、有效位损失和梯度更新。推理区固定条件建立逐层前缀缓存，每次改变动作和时间，负步长积分后得到动作并执行。</desc>
<defs><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#698292"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#245d8a"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a55b21"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176d69"/></marker></defs>
<style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b3a;font-size:18px} .small{font-size:16px;fill:#526777}.heading{font-size:26px;font-weight:650}.sub{font-size:21px;font-weight:600}.mono{font-family:ui-monospace,"DejaVu Sans Mono",monospace;font-size:16px}</style>
<rect width="1200" height="900" rx="14" fill="#ffffff"/>
<text x="38" y="44" class="heading" text-anchor="start"><tspan x="38" dy="0">同一个速度模型：训练一次，生成时反复调用</tspan></text>
<text x="38" y="73" class="small" text-anchor="start"><tspan x="38" dy="0">教学实现采用 π₀ 风格状态路径；训练不缓存过期参数，推理不输入示范答案</tspan></text>
<rect x="35" y="110" width="1130" height="310" rx="12" fill="#fafcfd" stroke="#ccd8e0" stroke-width="1.4"/>
<text x="58" y="147" class="sub" text-anchor="start"><tspan x="58" dy="0">训练：标签定义目标，损失沿允许的计算路径反传</tspan></text>
<rect x="58" y="176" width="225" height="95" rx="8" fill="#eef5fb" stroke="#245d8a" stroke-width="1.4"/>
<text x="170" y="209" class="" text-anchor="middle"><tspan x="170" dy="0">图像 + 文字 + 状态</tspan><tspan x="170" dy="30">c = (I, ℓ, s)</tspan></text>
<rect x="58" y="302" width="225" height="90" rx="8" fill="#fff5e9" stroke="#a55b21" stroke-width="1.4"/>
<text x="170" y="333" class="" text-anchor="middle"><tspan x="170" dy="0">示范动作 A、噪声 Z</tspan><tspan x="170" dy="28">生成时间 t</tspan></text>
<rect x="335" y="273" width="250" height="95" rx="8" fill="#fff5e9" stroke="#a55b21" stroke-width="1.4"/>
<text x="460" y="307" class="" text-anchor="middle"><tspan x="460" dy="0">Xₜ = tZ + (1−t)A</tspan><tspan x="460" dy="30">目标 U = Z − A</tspan></text>
<path d="M283 345 H332" fill="none" stroke="#a55b21" stroke-width="2.1" marker-end="url(#arrow-orange)"/>
<rect x="632" y="192" width="230" height="112" rx="8" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="747" y="226" class="" text-anchor="middle"><tspan x="747" dy="0">完整 VLA 前向</tspan><tspan x="747" dy="27">prefix + expert</tspan><tspan x="747" dy="27">输出 vθ(Xₜ,t,c)</tspan></text>
<path d="M283 222 H629" fill="none" stroke="#245d8a" stroke-width="2.1" marker-end="url(#arrow-blue)"/>
<path d="M585 298 H611 V271 H629" fill="none" stroke="#a55b21" stroke-width="2.1" marker-end="url(#arrow-orange)"/>
<rect x="910" y="206" width="230" height="89" rx="8" fill="#ffffff" stroke="#a55b21" stroke-width="1.4"/>
<text x="1025" y="239" class="" text-anchor="middle"><tspan x="1025" dy="0">有效位置上的 MSE</tspan><tspan x="1025" dy="28">仅归约有效标量</tspan></text>
<path d="M862 248 H907" fill="none" stroke="#176d69" stroke-width="2.1" marker-end="url(#arrow-green)"/>
<path d="M585 345 H1025 V298" fill="none" stroke="#a55b21" stroke-width="2.1" marker-end="url(#arrow-orange)"/>
<path d="M1025 206 V175 H748 V189" fill="none" stroke="#a55b21" stroke-width="2.1" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
<text x="703" y="381" class="small" text-anchor="start"><tspan x="703" dy="0">backward → 两组参数的有效梯度 → optimizer.step</tspan></text>
<text x="58" y="458" class="sub" text-anchor="start"><tspan x="58" dy="0">推理：固定一次观测，复用前缀 K/V；动态动作每轮替换</tspan></text>
<rect x="58" y="490" width="280" height="86" rx="8" fill="#eef5fb" stroke="#245d8a" stroke-width="1.4"/>
<text x="198" y="522" class="" text-anchor="middle"><tspan x="198" dy="0">本次图像 + 文字</tspan><tspan x="198" dy="29">prefix prefill：各层 Kₚ / Vₚ</tspan></text>
<rect x="58" y="621" width="280" height="83" rx="8" fill="#fff5e9" stroke="#a55b21" stroke-width="1.4"/>
<text x="198" y="653" class="" text-anchor="middle"><tspan x="198" dy="0">初始 X₁ = Z</tspan><tspan x="198" dy="29">当前状态 s，t = 1</tspan></text>
<rect x="422" y="529" width="330" height="164" rx="8" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="587" y="561" class="" text-anchor="middle"><tspan x="587" dy="0">读取固定 prefix cache</tspan><tspan x="587" dy="32">重算 state / action suffix</tspan><tspan x="587" dy="32">joint attention → vθ</tspan><tspan x="587" dy="32">位置仍对应同一动作块</tspan></text>
<path d="M338 532 H419" fill="none" stroke="#245d8a" stroke-width="2.1" marker-end="url(#arrow-blue)"/>
<path d="M338 661 H419" fill="none" stroke="#a55b21" stroke-width="2.1" marker-end="url(#arrow-orange)"/>
<rect x="830" y="556" width="310" height="106" rx="8" fill="#fff5e9" stroke="#a55b21" stroke-width="1.4"/>
<text x="985" y="590" class="" text-anchor="middle"><tspan x="985" dy="0">Euler：X ← X + Δt · vθ</tspan><tspan x="985" dy="27">t ← t + Δt，Δt = −1/N</tspan><tspan x="985" dy="27">重复 N 次，得到 X₀</tspan></text>
<path d="M752 610 H827" fill="none" stroke="#a55b21" stroke-width="2.1" marker-end="url(#arrow-orange)"/>
<path d="M985 662 V729 H587 V696" fill="none" stroke="#a55b21" stroke-width="2.1" marker-end="url(#arrow-orange)"/>
<text x="794" y="755" class="small" text-anchor="middle"><tspan x="794" dy="0">下一轮替换 X、t，不追加旧动作 K/V</tspan></text>
<rect x="830" y="793" width="310" height="63" rx="8" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="985" y="831" class="" text-anchor="middle"><tspan x="985" dy="0">反归一化 → 执行 K 步</tspan></text>
<path d="M1140 608 H1160 V824 H1143" fill="none" stroke="#176d69" stroke-width="2.1" marker-end="url(#arrow-green)"/>
<text x="58" y="813" class="small" text-anchor="start"><tspan x="58" dy="0">拿到新观测 / 指令 / 状态后重新建立缓存。</tspan><tspan x="58" dy="29">训练时是否保留梯度图，与参数冻结和 eval 是不同选择。</tspan></text>
<text x="460" y="396" class="small" text-anchor="middle">无效 NaN 在构造 Xₜ 前排除</text>
</svg>
