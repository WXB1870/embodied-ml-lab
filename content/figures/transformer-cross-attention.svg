<svg xmlns="http://www.w3.org/2000/svg" width="980" height="750" viewBox="0 0 980 750" role="img" aria-labelledby="title desc">
<title id="title">Cross-Attention：两个 Query 读取三个条件位置</title><desc id="desc">给出二维 Q/K/V 的明确数值、两行三列权重和两个输出。保持 Query 不变，将上下文由三个位置缩短为两个后，重新归一化并展示新的输出，说明输出长度由 Query 决定。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536777"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b74343"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e2e3b;font-size:18px}.heading{font-size:25px;font-weight:700}.sub{font-size:17px;fill:#536777}.small{font-size:15px;fill:#536777}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:17px}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="35" y="42" text-anchor="start" class="heading">Cross-Attention：Query 决定输出位置</text><text x="35" y="72" text-anchor="start" class="sub">本图省略 Batch / Head；Q 长度 L=2，条件长度 S=3，Q/K 宽度为 2。</text><rect x="35" y="110" width="290" height="84" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="180.0" y="148.0" text-anchor="middle">Query Q：两行</text><text x="180.0" y="170.0" text-anchor="middle" class="small">√2 ln 2 × [[1,0],[0,1]]</text><rect x="365" y="110" width="270" height="84" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="500.0" y="148.0" text-anchor="middle">Key K：三行</text><text x="500.0" y="170.0" text-anchor="middle" class="small">(1,0) · (0,1) · (0,0)</text><rect x="675" y="110" width="270" height="84" rx="7" fill="#fff6e9" stroke="#aa6922" stroke-width="1.4"/><text x="810.0" y="148.0" text-anchor="middle">Value V：三行</text><text x="810.0" y="170.0" text-anchor="middle" class="small">(2,0) · (0,4) · (2,2)</text><path d="M180,194 L180,234 L450,234 L450,270" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M500,194 L500,270" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="270" width="340" height="70" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="480.0" y="301.0" text-anchor="middle">QKᵀ / √2 → softmax over K</text><text x="480.0" y="323.0" text-anchor="middle" class="small">[2,2] × [2,3] → [2,3]</text><path d="M480,340 L480,362" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="377" text-anchor="start" class="sub">两个 Query，分别归一化</text><text x="395" y="382" text-anchor="middle" class="sub">k₁</text><text x="485" y="382" text-anchor="middle" class="sub">k₂</text><text x="575" y="382" text-anchor="middle" class="sub">k₃</text><text x="307" y="426" text-anchor="end" class="sub">q₁</text><rect x="350" y="398" width="88" height="54" fill="#a8b9eb" stroke="#fff"/><text x="394" y="432" text-anchor="middle" class="mono">1/2</text><rect x="440" y="398" width="88" height="54" fill="#e4eafa" stroke="#fff"/><text x="484" y="432" text-anchor="middle" class="mono">1/4</text><rect x="530" y="398" width="88" height="54" fill="#e4eafa" stroke="#fff"/><text x="574" y="432" text-anchor="middle" class="mono">1/4</text><text x="307" y="490" text-anchor="end" class="sub">q₂</text><rect x="350" y="462" width="88" height="54" fill="#e4eafa" stroke="#fff"/><text x="394" y="496" text-anchor="middle" class="mono">1/4</text><rect x="440" y="462" width="88" height="54" fill="#a8b9eb" stroke="#fff"/><text x="484" y="496" text-anchor="middle" class="mono">1/2</text><rect x="530" y="462" width="88" height="54" fill="#e4eafa" stroke="#fff"/><text x="574" y="496" text-anchor="middle" class="mono">1/4</text><path d="M810,194 L910,194 L910,440 L864,440" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M625,440 L675,440" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="675" y="392" width="190" height="99" rx="7" fill="#fff6e9" stroke="#aa6922" stroke-width="1.4"/><text x="770.0" y="437.5" text-anchor="middle">O = A @ V</text><text x="770.0" y="459.5" text-anchor="middle" class="small">(1.5,1.5) / (1,2.5)</text><text x="675" y="525" text-anchor="start" class="mono">O 始终为 [2,2]</text><path d="M35,558 L945,558" fill="none" stroke="#536777" stroke-width="1"/><text x="35" y="594" text-anchor="start" class="sub">只保留 k₁、k₂：必须重新归一化</text><text x="35" y="630" text-anchor="start" class="mono">A₂ = [[2/3,1/3], [1/3,2/3]]</text><text x="35" y="665" text-anchor="start" class="mono">O₂ = [(4/3,4/3), (2/3,8/3)]</text><text x="550" y="622" text-anchor="start" class="sub">输出仍有两行，数值已变化。</text><text x="550" y="657" text-anchor="start" class="small">把第三列置零但保留旧分母，不等价。</text><text x="35" y="716" text-anchor="start" class="small">若 S=1，Softmax 恒为 1：两条 Query 读取相同 V，Q/K 的该路径梯度为零。</text></svg>
