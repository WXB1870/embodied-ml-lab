<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" role="img" aria-labelledby="title desc">
<title id="title">两层教学模型：decoder-only · Pre-LN · RoPE</title><desc id="desc">左列为同一组 B=2,T=4,D=8 输入经过 Embedding、两层 Block、最终 LayerNorm、词表头和 CE；右列展开一层 Pre-LN Block，显示两条恒等残差、RoPE 位于 Q/K、FFN 宽度 32，每层另存 K/V。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536777"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b74343"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e2e3b;font-size:18px}.heading{font-size:25px;font-weight:700}.sub{font-size:17px;fill:#536777}.small{font-size:15px;fill:#536777}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:17px}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="35" y="42" text-anchor="start" class="heading">同一个两层模型，从输入到梯度</text><text x="35" y="72" text-anchor="start" class="sub">B=2 · T=4 · D=8 · H=2 · dₕ=4 · Nlayer=2 · vocab=7</text><rect x="40" y="105" width="315" height="66" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="197.5" y="134.0" text-anchor="middle">Token IDs</text><text x="197.5" y="156.0" text-anchor="middle" class="small">[2,4]</text><rect x="40" y="200" width="315" height="66" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="197.5" y="229.0" text-anchor="middle">Token Embedding</text><text x="197.5" y="251.0" text-anchor="middle" class="small">[2,4,8]</text><path d="M198,171 L198,200" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="295" width="315" height="66" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="197.5" y="324.0" text-anchor="middle">Block 0 → Block 1</text><text x="197.5" y="346.0" text-anchor="middle" class="small">两层独立参数 · [2,4,8]</text><path d="M198,266 L198,295" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="420" width="315" height="66" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="197.5" y="449.0" text-anchor="middle">Final LayerNorm</text><text x="197.5" y="471.0" text-anchor="middle" class="small">仅沿最后 8 个通道</text><path d="M198,361 L198,420" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="515" width="315" height="66" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="197.5" y="544.0" text-anchor="middle">Linear 8 → 7</text><text x="197.5" y="566.0" text-anchor="middle" class="small">logits [2,4,7]</text><path d="M198,486 L198,515" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="610" width="315" height="66" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="197.5" y="639.0" text-anchor="middle">Cross-entropy</text><text x="197.5" y="661.0" text-anchor="middle" class="small">labels [2,4] · 平均 8 个位置</text><path d="M198,581 L198,610" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="705" width="315" height="66" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="197.5" y="734.0" text-anchor="middle">backward → AdamW</text><text x="197.5" y="756.0" text-anchor="middle" class="small">28 组参数获得梯度</text><path d="M198,676 L198,705" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="820" text-anchor="start" class="sub">标签只移位一次</text><text x="40" y="848" text-anchor="start" class="mono">[0,1,2,3] → [1,2,3,4]</text><text x="40" y="880" text-anchor="start" class="small">生成时将模型输出 ID 反馈到输入。</text><rect x="430" y="105" width="530" height="666" rx="10" fill="#fafbfc" stroke="#9cabb5" stroke-dasharray="6 5"/><text x="455" y="136" text-anchor="start" class="sub">展开一个 Block：先注意力，再 FFN</text><text x="680" y="175" text-anchor="middle" class="mono">x [2,4,8]</text><rect x="555" y="200" width="250" height="52" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="680.0" y="232.0" text-anchor="middle">LayerNorm₁</text><path d="M680,181 L680,200" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="555" y="278" width="250" height="72" rx="7" fill="#eef2ff" stroke="#365bc5" stroke-width="1.4"/><text x="680.0" y="310.0" text-anchor="middle">Causal MHA</text><text x="680.0" y="332.0" text-anchor="middle" class="small">Q/K + RoPE · V 不旋转</text><path d="M680,252 L680,278" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="555" y="380" width="250" height="48" rx="7" fill="#f6f8fa" stroke="#81909c" stroke-width="1.4"/><text x="680.0" y="410.0" text-anchor="middle">h = x + Attention</text><path d="M680,350 L680,380" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M680,184 L475,184 L475,404 L555,404" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="466" y="285" text-anchor="end" class="small">x</text><rect x="555" y="460" width="250" height="52" rx="7" fill="#edf8f4" stroke="#18776c" stroke-width="1.4"/><text x="680.0" y="492.0" text-anchor="middle">LayerNorm₂(h)</text><path d="M680,428 L680,460" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="555" y="540" width="250" height="72" rx="7" fill="#fff6e9" stroke="#aa6922" stroke-width="1.4"/><text x="680.0" y="572.0" text-anchor="middle">Linear → GELU → Linear</text><text x="680.0" y="594.0" text-anchor="middle" class="small">8 → 32 → 8</text><path d="M680,512 L680,540" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><rect x="555" y="646" width="250" height="48" rx="7" fill="#f6f8fa" stroke="#81909c" stroke-width="1.4"/><text x="680.0" y="676.0" text-anchor="middle">y = h + FFN</text><path d="M680,612 L680,646" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><path d="M680,444 L915,444 L915,670 L805,670" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="922" y="553" text-anchor="start" class="small">h</text><path d="M680,694 L680,735" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="756" text-anchor="middle" class="sub">下一层读取新的 y</text><path d="M355,328 L430,328" fill="none" stroke="#536777" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M805,310 L895,310 L895,230" fill="none" stroke="#536777" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="895" y="204" text-anchor="middle" class="small">每层 K/V</text><text x="895" y="226" text-anchor="middle" class="small">[2,2,P,4]</text><text x="455" y="820" text-anchor="start" class="small">每层 Attention 内的 RoPE 编码位置。</text></svg>
