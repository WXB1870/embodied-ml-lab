<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" width="1200" height="890" role="img" aria-labelledby="title desc">
<title id="title">两组参数的联合注意力及 π₀、π₀.₅ 可见性</title><desc id="desc">上方展示两流分别投影到共同的注意力头空间后连接和拆分。下方行是 Query 列是 Key，π₀ 有前缀、状态、动作三块，π₀.₅ 默认公开 Flow 实现是包含离散状态的前缀和动作两块。</desc>
<defs><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#698292"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#245d8a"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a55b21"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176d69"/></marker></defs>
<style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b3a;font-size:18px} .small{font-size:16px;fill:#526777}.heading{font-size:26px;font-weight:650}.sub{font-size:21px;font-weight:600}.mono{font-family:ui-monospace,"DejaVu Sans Mono",monospace;font-size:16px}</style>
<rect width="1200" height="890" rx="14" fill="#ffffff"/>
<text x="38" y="44" class="heading" text-anchor="start"><tspan x="38" dy="0">联合的是注意力空间，独立的是参数</tspan></text>
<text x="38" y="73" class="small" text-anchor="start"><tspan x="38" dy="0">OpenPI 215abfb · 以下 Mask 对每层相同，Padding 另与 Query / Key 有效位相交</tspan></text>
<rect x="55" y="110" width="420" height="78" rx="8" fill="#eef5fb" stroke="#245d8a" stroke-width="1.4"/>
<text x="265" y="141" class="" text-anchor="middle"><tspan x="265" dy="0">Pˡ : [B,Nₚ,dₚ]</tspan><tspan x="265" dy="28">前缀 RMSNorm + WQp / WKp / WVp</tspan></text>
<rect x="725" y="110" width="420" height="78" rx="8" fill="#fff5e9" stroke="#a55b21" stroke-width="1.4"/>
<text x="935" y="141" class="" text-anchor="middle"><tspan x="935" dy="0">Sˡ : [B,Nₛ,dₐ]</tspan><tspan x="935" dy="28">专家 RMSNorm + WQa / WKa / WVa</tspan></text>
<path d="M265 188 V225 H486" fill="none" stroke="#245d8a" stroke-width="2.1" marker-end="url(#arrow-blue)"/>
<path d="M935 188 V225 H714" fill="none" stroke="#a55b21" stroke-width="2.1" marker-end="url(#arrow-orange)"/>
<rect x="488" y="195" width="224" height="60" rx="8" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="600" y="220" class="" text-anchor="middle"><tspan x="600" dy="0">Q/K/V 按 token 连接</tspan><tspan x="600" dy="24">头数与头维兼容</tspan></text>
<path d="M600 255 V287" fill="none" stroke="#176d69" stroke-width="2.1" marker-end="url(#arrow-green)"/>
<rect x="300" y="289" width="600" height="60" rx="8" fill="#ffffff" stroke="#176d69" stroke-width="1.4"/>
<text x="600" y="325" class="" text-anchor="middle"><tspan x="600" dy="0">RoPE(Q,K) → Mask → softmax over keys → weighted V</tspan></text>
<path d="M440 349 V390 H265 V411" fill="none" stroke="#245d8a" stroke-width="2.1" marker-end="url(#arrow-blue)"/>
<path d="M760 349 V390 H935 V411" fill="none" stroke="#a55b21" stroke-width="2.1" marker-end="url(#arrow-orange)"/>
<rect x="55" y="414" width="420" height="65" rx="8" fill="#eef5fb" stroke="#245d8a" stroke-width="1.4"/>
<text x="265" y="440" class="" text-anchor="middle"><tspan x="265" dy="0">前缀输出投影 / 残差 / FFN</tspan><tspan x="265" dy="25">Pˡ⁺¹ 进入下一层</tspan></text>
<rect x="725" y="414" width="420" height="65" rx="8" fill="#fff5e9" stroke="#a55b21" stroke-width="1.4"/>
<text x="935" y="440" class="" text-anchor="middle"><tspan x="935" dy="0">专家输出投影 / 残差 / FFN</tspan><tspan x="935" dy="25">Sˡ⁺¹ 进入下一层</tspan></text>
<text x="55" y="534" class="sub" text-anchor="start"><tspan x="55" dy="0">π₀：三个可见性块</tspan></text>
<text x="690" y="534" class="sub" text-anchor="start"><tspan x="690" dy="0">π₀.₅：默认公开 Flow 路径</tspan></text>
<text x="300" y="569" class="small" text-anchor="middle"><tspan x="300" dy="0">Key →</tspan></text>
<text x="110" y="678" class="small" text-anchor="middle"><tspan x="110" dy="0">Query ↓</tspan></text>
<text x="237.0" y="587" class="" text-anchor="middle"><tspan x="237.0" dy="0">P</tspan></text>
<text x="301.0" y="587" class="" text-anchor="middle"><tspan x="301.0" dy="0">S</tspan></text>
<text x="365.0" y="587" class="" text-anchor="middle"><tspan x="365.0" dy="0">A</tspan></text>
