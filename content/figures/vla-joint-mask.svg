<text x="364.0" y="626" class="" text-anchor="middle"><tspan x="364.0" dy="0">0</tspan></text>
<text x="185" y="692" class="" text-anchor="middle"><tspan x="185" dy="0">S</tspan></text>
<rect x="205" y="653" width="61" height="61" rx="2" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="236.0" y="690" class="" text-anchor="middle"><tspan x="236.0" dy="0">1</tspan></text>
<rect x="269" y="653" width="61" height="61" rx="2" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="300.0" y="690" class="" text-anchor="middle"><tspan x="300.0" dy="0">1</tspan></text>
<rect x="333" y="653" width="61" height="61" rx="2" fill="#eff3f6" stroke="#dce4e9" stroke-width="1.4"/>
<text x="364.0" y="690" class="" text-anchor="middle"><tspan x="364.0" dy="0">0</tspan></text>
<text x="185" y="756" class="" text-anchor="middle"><tspan x="185" dy="0">A</tspan></text>
<rect x="205" y="717" width="61" height="61" rx="2" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="236.0" y="754" class="" text-anchor="middle"><tspan x="236.0" dy="0">1</tspan></text>
<rect x="269" y="717" width="61" height="61" rx="2" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="300.0" y="754" class="" text-anchor="middle"><tspan x="300.0" dy="0">1</tspan></text>
<rect x="333" y="717" width="61" height="61" rx="2" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="364.0" y="754" class="" text-anchor="middle"><tspan x="364.0" dy="0">1</tspan></text>
<text x="430" y="625" class="small" text-anchor="start"><tspan x="430" dy="0">P = 图像 + 语言</tspan><tspan x="430" dy="28">S = 连续状态</tspan><tspan x="430" dy="28">A = 整块噪声动作</tspan></text>
<text x="430" y="724" class="small" text-anchor="start"><tspan x="430" dy="0">P 不读 S / A</tspan><tspan x="430" dy="27">S 不读 A</tspan><tspan x="430" dy="27">A 块内部全开放</tspan></text>
<text x="884" y="571" class="small" text-anchor="middle"><tspan x="884" dy="0">Key →</tspan></text>
<text x="847.5" y="610" class="" text-anchor="middle"><tspan x="847.5" dy="0">P′</tspan></text>
<text x="922.5" y="610" class="" text-anchor="middle"><tspan x="922.5" dy="0">A</tspan></text>
<text x="784" y="665" class="" text-anchor="middle"><tspan x="784" dy="0">P′</tspan></text>
<rect x="810" y="622" width="72" height="72" rx="2" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="846.5" y="665" class="" text-anchor="middle"><tspan x="846.5" dy="0">1</tspan></text>
<rect x="885" y="622" width="72" height="72" rx="2" fill="#eff3f6" stroke="#dce4e9" stroke-width="1.4"/>
<text x="921.5" y="665" class="" text-anchor="middle"><tspan x="921.5" dy="0">0</tspan></text>
<text x="784" y="740" class="" text-anchor="middle"><tspan x="784" dy="0">A</tspan></text>
<rect x="810" y="697" width="72" height="72" rx="2" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="846.5" y="740" class="" text-anchor="middle"><tspan x="846.5" dy="0">1</tspan></text>
<rect x="885" y="697" width="72" height="72" rx="2" fill="#ebf7f4" stroke="#176d69" stroke-width="1.4"/>
<text x="921.5" y="740" class="" text-anchor="middle"><tspan x="921.5" dy="0">1</tspan></text>
<text x="990" y="644" class="small" text-anchor="start"><tspan x="990" dy="0">P′ = 图像、语言</tspan><tspan x="990" dy="26">与离散状态 token</tspan></text>
<text x="990" y="725" class="small" text-anchor="start"><tspan x="990" dy="0">专家不再另加</tspan><tspan x="990" dy="26">连续 state token</tspan></text>
<text x="55" y="827" class="small" text-anchor="start"><tspan x="55" dy="0">1 = 对应子块内全部允许；0 = 全部禁止。组号而非 token 索引决定块间顺序。</tspan></text>
<text x="55" y="859" class="small" text-anchor="start"><tspan x="55" dy="0">π₀.₅ 论文联合训练还含 FAST 监督序列；此图不将它混入公开 Flow-only 的输入前缀。</tspan></text>
</svg>
