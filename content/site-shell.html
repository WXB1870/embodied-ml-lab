<script>
(() => {
  let theme;
  try { theme = localStorage.getItem('embodied-ml-theme'); } catch {}
  if (theme !== 'light' && theme !== 'dark') {
    theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0B0F17' : '#F8F9FB';
})();
</script>
