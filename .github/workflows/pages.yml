name: Validate Embodied ML Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://wxb1870.github.io/embodied-ml-lab/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build website
        run: |
          python scripts/assemble.py
          node scripts/prerender.cjs
          touch dist/.nojekyll
      - name: Check deployment paths and pages
        run: |
          node scripts/validate_routes.cjs
          python scripts/validate_site.py
